[project]
name = "realtydog"
version = "0.1.0"
description = "Off-market event-venue property finder for a small investor group (DFW)."
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
